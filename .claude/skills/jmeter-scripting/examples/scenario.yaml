# 完整示例:混合流量 + CSV 多账号 + 脚本内登录 + 关联提取
#
# 生成:
#   python3 scripts/gen_jmx.py -s examples/scenario.yaml \
#     -c api-catalog.json -c curl-catalog.json -o out/
#
# 字段说明见 references/scenario-schema.md

name: Demo Shop 混合流量压测

# 含协议、域名、端口、basePath。注意不要用 Swagger 文档里的 host,
# 那通常是文档服务器地址而不是测试环境。
base_url: http://staging.example.com:8080/api

# CSV 多账号。文件路径相对于 JMeter 的运行目录。
data:
  file: users.csv
  vars: [username, password]
  recycle: true          # 线程数 > 账号数时必须开,否则线程会被停掉

defaults:
  headers:
    Content-Type: application/json
  think_time: 1000       # 毫秒,每步可覆盖

thread_groups:
  - name: 主流量
    load:
      threads: 500       # 会写成 ${__P(tg1.threads,500)},CI 可用 -J tg1.threads=1000 覆盖
      ramp_up: 120       # 秒
      hold: 600          # 秒

    # 放进 Once Only Controller:每个虚拟用户只登录一次,之后复用 token。
    # 真实用户不会每点一次就重新登录。
    login:
      api: "POST /auth/login"
      body:
        username: "${username}"
        password: "${password}"
      extract:
        token: "$.data.accessToken"
      assert:
        jsonpath: "$.code"
        equals: "0"

    # 挂在 Throughput Controller 层,登录请求自己不会带上还没提取出来的 token
    auth_header:
      Authorization: "Bearer ${token}"

    # 权重必须合计 100
    mix:
      - { flow: 商品浏览, weight: 70 }
      - { flow: 下单主链路, weight: 30 }

flows:
  # 每个 flow 必须自给自足:混合比例下 flow 之间没有执行顺序保证,
  # 引用别的 flow 提取的变量会被生成器拒绝。
  - name: 商品浏览
    steps:
      - api: "GET /products"
        name: 商品列表
        query: { page: 1, size: 20 }
        extract:
          productId: "$.data.list[0].id"

      - api: "GET /products/{id}"
        name: 商品详情
        path_vars:
          id: "${productId}"
        think_time: 2000
        assert:
          status: 200

  - name: 下单主链路
    steps:
      # 本 flow 自己取一次商品,不依赖「商品浏览」flow
      - api: "GET /products"
        name: 下单前选品
        extract:
          buyId: "$.data.list[0].id"

      - api: "POST /orders"
        name: 创建订单
        body:
          productId: "${buyId}"
          qty: 1
          remark: "load-test"
        assert:
          jsonpath: "$.code"
          equals: "0"
