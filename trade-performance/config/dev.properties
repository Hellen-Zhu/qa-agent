# ─────────────────────────────────────────────────────────────
# 维度二：环境
# 只描述"打哪个环境"，绝不包含线程数/时长/ramp-up（那是 profiles/ 的职责）
# 用法：jmeter ... -q config/dev.properties
# ─────────────────────────────────────────────────────────────

protocol=http
host=localhost
port=8080
basePath=/api/v1

connectTimeout=5000
responseTimeout=60000

# ── 身份（本项目无 login / 无 token，权限完全由 X-User-Id 决定）──
# userMode=pool  从 data/shared/accounts.csv 轮换取用户（默认，更接近真实）
# userMode=fixed 全部线程共用 fixedUserId（用于测同一 maker 的竞争）
userMode=pool
fixedUserId=maker@sc.com

# X-User-ID: anonymous —— 真实 curl 里存在，与 X-User-Id 仅大小写不同。
# 按 RFC 7230 §3.2 header 名大小写不敏感，两者是同一个 header。
# 这里保留原样以复现"已知可用"的请求，但首次 smoke 必须确认实际发出去的是什么。
# 若确认服务端只认 X-User-Id，把 Header Manager 里那一行删掉即可。
legacyUserId=anonymous

# 来自真实 curl，语义待确认
dynRun=false

# ── 参考数据 ──
refdataPageSize=200

# preflightPolicy=abort | prune | warn —— 见 groovy/preflight-policy.groovy
# dev 环境数据波动大，默认 warn，避免天天卡在开跑前
preflightPolicy=warn
preflightMinPoolSize=1

# ── 被测数据规模 ──
portfolioSelect=roundRobin
