# ─────────────────────────────────────────────────────────────
# 维度二：环境
# 只描述"打哪个环境"，绝不包含线程数/时长/ramp-up（那是 profiles/ 的职责）
# 用法：jmeter ... -q config/dev.properties
# ─────────────────────────────────────────────────────────────

# ── 服务寻址：5 个 svc 各自独立 ──────────────────────────────
# 每个原子 fragment 显式引用自己服务的属性（校验规则 R3 会检查目录与前缀一致）。
# 刻意不设全局 host —— 忘记写 domain 的 sampler 会直接失败，而不是静默打到别的服务。
#
# svc 与模块的对应见 api-registry.csv：
#   workers        trade-management / product-management / checker-flow
#   uc             entitlements
#   refdata        counterparties / portfolios
#   notifications  inbox / unread-count
#   ops            trade-aging 等批处理

# ── workers：已确认 ──
# 来源：2026-07-28 dev 环境实测 curl
#   POST http://10.198.25.56:9089/api/v1/trades/create
# p02-trade-create 只用到这一组，填了就能跑。
workers.protocol=http
workers.host=10.198.25.56
workers.port=9089
workers.basePath=/api/v1

# ── 以下四组：仍是占位值，未经确认（NFR 待确认 #12）────────────
# 刻意**不**跟着 workers 一起填成 10.198.25.56:9089。
# 那是个看起来合理的猜测，而猜对了没人会去核实、猜错了会表现为 404 —— 被当成
# "接口不存在"而不是"地址配错了"。留 localhost 则是连接拒绝，一眼就知道没配。
#
# 影响范围：s01/s02/s03/s04（E2E，要查 refdata）、p05、j02 等。
# p02-trade-create 不受影响。
# 确认方式与 workers 相同：在 UI 上触发一次该操作，DevTools → Copy as cURL。
uc.protocol=http
uc.host=localhost
uc.port=8080
uc.basePath=/api/v1

refdata.protocol=http
refdata.host=localhost
refdata.port=8080
refdata.basePath=/api/v1

notifications.protocol=http
notifications.host=localhost
notifications.port=8080
notifications.basePath=/api/v1

ops.protocol=http
ops.host=localhost
ops.port=8080
ops.basePath=/api/v1

connectTimeout=5000
responseTimeout=60000

# ── 身份（本项目无 login / 无 token，权限完全由 X-User-Id 决定）──
# 角色固定，不轮换：
#   maker@sc.com    全部 event 操作（create / trigger-event / calculate-risk / 列表查询）
#   checker@sc.com  approve / reject / pending-tasks
#
# 四眼原则要求 checker ≠ maker（NFR SEC-02）。早期版本两个角色都从
# accounts.csv 取值，而那份 CSV 五行全是 MAKER —— 等于"maker 审批自己提交的单子"，
# checker 场景压根不成立。固定两个身份是最简单的正确做法。
#
# 身份由**线程组级 UDV** effectiveUserId 声明（与 runPhase 同一个位置），
# 不再需要每次迭代跑一段 groovy —— 全部 14 个线程组都是单一角色，
# 身份在整个线程组生命周期内是常量，per-iteration 计算没有任何东西可算。
makerUserId=maker@sc.com
checkerUserId=checker@sc.com

# ⚠ 真实 curl 里同时存在 X-User-ID 和 X-User-Id，仅大小写不同。
#   按 RFC 7230 §3.2 header 名大小写不敏感，两者是**同一个 header**。
#   原先前者写死 anonymous —— 若服务端取第一个出现的值，全部请求都会以
#   anonymous 身份执行，maker/checker 的区分静默失效，而报告完全看不出来。
#   现在两行取同一个值 ${effectiveUserId}，无论服务端读哪个都是对的。
#   首次 smoke 用 View Results Tree 确认实际发出去的是什么；
#   确认只认 X-User-Id 后，把 Header Manager 里 X-User-ID 那一行删掉。

# 来自真实 curl，语义待确认
dynRun=false

# ── 参考数据 ──
# 取数模式由**计划级 UDV** refdataSource 决定，不在这里设：
#   s01（E2E）      pool —— setUp 查 GET /refdata/* 建池，refdata 是被测链路的一部分
#   p02（单接口）   csv  —— data/refdata/refdata-pairs.csv 直接供数，不查 refdata
# 全局属性只作为命令行临时覆盖手段（-JrefdataSource=pool）。
#
# refdataFile 换成 refdata-pairs-single.csv 即得到"全部线程打同一个 portfolio"
# 的对照实验（csv 模式下 portfolioSelect 属性不生效）。
refdataFile=data/refdata/refdata-pairs.csv

# 仅 pool 模式使用
refdataPageSize=200

# preflightPolicy=abort | prune | warn —— 见 groovy/preflight-policy.groovy
# dev 环境数据波动大，默认 warn，避免天天卡在开跑前
preflightPolicy=warn
preflightMinPoolSize=1

# ── 被测数据规模 ──
portfolioSelect=roundRobin

# ── Checker flow ────────────────────────────────────────────
checkerPageSize=200
# claim-once 池的最小容量。池不足说明环境里没有足够待审批任务，
# 先跑一轮 s01-create-trade-e2e 造数（每笔 create 产生一个 checker task）。
checkerMinPoolSize=1
# bulk-approve / bulk-reject 单批笔数（Workload Modeling A9）。
# NFR PERF-16 要求在 1 / 5 / 20 / 50 下分别测，看单位工作量耗时的走向。
checkerBatchSize=20
# 拒绝率（%），Workload Modeling A8。reject 路径更贵（snapshot 恢复 + 审计写入）。
checkerRejectRate=5
checkerRejectReason=PERF TEST rejection

# ── Blotter / Trade list ────────────────────────────────────
# A10：Trade Portal 单页 blotter 数。与 A11(自动刷新间隔) 的乘积是 OREO
# 最大的单一容量变量 —— 且两者都是**前端配置项**，确认成本极低。
blottersPerPage=4
# A17：单 blotter 返回行数。同时是 S-09 扇出审计与 S-10 数据量伸缩的扫描维度。
blotterPageSize=200
# blotterStatusFilter=ACTIVE   # 可选，留空则不带 status 参数

# 单接口测试用的 trade 池下限。池太小会让线程反复撞同一笔 trade，
# 产生大量 lockedRejection（四眼原则的正确行为，但会污染容量结论）。
tradePoolMinSize=10
