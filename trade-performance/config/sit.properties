# ── 服务寻址：5 个 svc 各自独立 ──────────────────────────────
# 每个原子 fragment 显式引用自己服务的属性（校验规则 R3 会检查目录与前缀一致）。
# 刻意不设全局 host —— 忘记写 domain 的 sampler 会直接失败，而不是静默打到别的服务。
#
# svc 与模块的对应见 api-registry.csv：
#   workers        trade-management / product-management / checker-flow
#   uc             entitlements
#   refdata        counterparties / portfolios
#   notifications  inbox / unread-count
#   ops            trade-aging 等批处理
# ⚠ 下列 host/port 为占位值，待运维提供真实地址（NFR 待确认 #12）。

workers.protocol=http
workers.host=sit.oreo.internal
workers.port=8080
workers.basePath=/api/v1

uc.protocol=http
uc.host=sit.oreo.internal
uc.port=8080
uc.basePath=/api/v1

refdata.protocol=http
refdata.host=sit.oreo.internal
refdata.port=8080
refdata.basePath=/api/v1

notifications.protocol=http
notifications.host=sit.oreo.internal
notifications.port=8080
notifications.basePath=/api/v1

ops.protocol=http
ops.host=sit.oreo.internal
ops.port=8080
ops.basePath=/api/v1

# 维度二：环境 —— SIT

connectTimeout=5000
responseTimeout=60000

userMode=pool
fixedUserId=maker@sc.com

# X-User-ID: anonymous —— 真实 curl 里存在，与 X-User-Id 仅大小写不同。
# 按 RFC 7230 §3.2 header 名大小写不敏感，两者是同一个 header。
# 这里保留原样以复现"已知可用"的请求，但首次 smoke 必须确认实际发出去的是什么。
# 若确认服务端只认 X-User-Id，把 Header Manager 里那一行删掉即可。
legacyUserId=anonymous
dynRun=false

refdataPageSize=200

preflightPolicy=prune
preflightMinPoolSize=3

portfolioSelect=roundRobin
